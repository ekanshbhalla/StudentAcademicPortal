
spring.application.name=academic-course-planning

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:9122/academic_planning}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/academic_planning_logs?serverSelectionTimeoutMS=1000}
spring.data.mongodb.database=${MONGODB_DATABASE:academic_planning_logs}

jwt.secret=${JWT_SECRET:mysecretkeymysecretkeymysecretkey123}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

server.port=${PORT:8081}
